[project]
name = "cxr-labeller-backend"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
]

[dependency-groups]
# fastapi-cli provides the `fastapi dev` command; the container runs uvicorn
# directly and syncs with --no-dev, so it stays out of the runtime image.
dev = ["ruff", "pytest", "httpx", "fastapi-cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
